{% extends 'base.html' %}

{% block content %}
<from method="POST">

  {% csrf_token %}
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .signup-page {
        min-height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #111111, #2b2b2b);
        padding: 20px;
    }

    .signup-container {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        animation: apparition 0.7s ease;
    }

    @keyframes apparition {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: linear-gradient(135deg, #d4af37, #f5d76e);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        font-weight: bold;
        color: #111;
        box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
    }

    .signup-container h1 {
        text-align: center;
        color: #111;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    .input-container {
        position: relative;
    }

    .input-container input {
        width: 100%;
        padding: 14px 45px 14px 15px;
        border: 2px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
    }

    .input-container input:focus {
        border-color: #d4af37;
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    .icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
    }

    .password-toggle {
        cursor: pointer;
    }

    .password-strength {
        height: 5px;
        width: 0%;
        border-radius: 5px;
        margin-top: 8px;
        transition: 0.3s;
    }

    .password-message {
        font-size: 12px;
        margin-top: 5px;
        color: #777;
    }

    .signup-button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #d4af37, #b8860b);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .signup-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(184, 134, 11, 0.35);
    }

    .login-link {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
        color: #777;
    }

    .login-link a {
        color: #b8860b;
        font-weight: bold;
        text-decoration: none;
    }
</style>

<div class="signup-page">

    <div class="signup-container">

        <div class="logo">
            A
        </div>

        <h1>Créer un compte</h1>

        <p class="subtitle">
            Inscrivez vous 
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="username">
                    Nom d'utilisateur
                </label>

                <div class="input-container">
                    <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Nom d'utilisateur"
                        required
                    >

                    <span class="icon">👤</span>
                </div>
            </div>

            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <div class="input-container">

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Créer un mot de passe"
                        required
                        oninput="checkPassword()"
                    >

                    <span
                        class="icon password-toggle"
                        onclick="togglePassword()"
                        id="eye"
                    >
                        👁️
                    </span>

                </div>

                <div
                    class="password-strength"
                    id="strength">
                </div>

                <div
                    class="password-message"
                    id="passwordMessage">
                    Utilise au moins 8 caractères.
                </div>

            </div>

            <button
                type="submit"
                class="signup-button">
                Créer mon compte ✨
            </button>

        </form>

        <div class="login-link">
            Tu as déjà un compte ?
            <a href="#">Se connecter</a>
        </div>

    </div>

</div>

<script>
function togglePassword() {

    const password = document.getElementById("password");
    const eye = document.getElementById("eye");

    if (password.type === "password") {
        password.type = "text";
        eye.textContent = "🙈";
    } else {
        password.type = "password";
        eye.textContent = "👁️";
    }
}

function checkPassword() {

    const password = document.getElementById("password");
    const strength = document.getElementById("strength");
    const message = document.getElementById("passwordMessage");

    let score = 0;

    if (password.value.length >= 8) score++;
    if (/[A-Z]/.test(password.value)) score++;
    if (/[0-9]/.test(password.value)) score++;
    if (/[^A-Za-z0-9]/.test(password.value)) score++;

    if (password.value.length === 0) {

        strength.style.width = "0%";
        message.textContent = "Utilise au moins 8 caractères.";

    } else if (score === 1) {

        strength.style.width = "25%";
        strength.style.background = "#e74c3c";
        message.textContent = "Mot de passe faible";

    } else if (score === 2) {

        strength.style.width = "50%";
        strength.style.background = "#f39c12";
        message.textContent = "Mot de passe moyen";

    } else if (score === 3) {

        strength.style.width = "75%";
        strength.style.background = "#f1c40f";
        message.textContent = "Bon mot de passe";

    } else {

        strength.style.width = "100%";
        strength.style.background = "#27ae60";
        message.textContent = "Excellent mot de passe !";
    }
}
</script>
</from>
{% endblock %}
